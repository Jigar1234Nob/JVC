name: Build JVC

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jvc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-dependencies:
    name: Resolve shared npm and Rust dependency locks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: Check for committed dependency lockfiles
        id: lockfiles
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "npm_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f src-tauri/Cargo.lock ]; then
            echo "cargo_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the npm lockfile when absent
        if: steps.lockfiles.outputs.npm_exists == 'false'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate the Rust lockfile when absent
        if: steps.lockfiles.outputs.cargo_exists == 'false'
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Validate the Rust lockfile
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - name: Commit generated lockfiles on main
        if: (steps.lockfiles.outputs.npm_exists == 'false' || steps.lockfiles.outputs.cargo_exists == 'false') && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Add dependency lockfiles for reproducible builds"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jvc-dependency-locks
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: resolve-dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
            bundle_path: src-tauri/target/release/bundle/**/*
          - os: macos-15
            target: macos-universal
            bundle_path: src-tauri/target/universal-apple-darwin/release/bundle/**/*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jvc-dependency-locks
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install universal macOS Rust targets
        if: matrix.target == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --no-audit --no-fund
      - name: Generate platform app icons
        run: npx tauri icon src-tauri/icons/app-icon.svg --output src-tauri/icons
      - name: Build desktop package
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos-universal" ]; then
            npm run desktop:build -- --target universal-apple-darwin
          else
            npm run desktop:build
          fi
      - name: Verify Windows installer outputs
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/release/bundle"
          $exe = Get-ChildItem $bundleRoot -Recurse -Filter *.exe -File
          $msi = Get-ChildItem $bundleRoot -Recurse -Filter *.msi -File
          if ($exe.Count -lt 1) { throw "No NSIS .exe installer was produced." }
          if ($msi.Count -lt 1) { throw "No MSI installer was produced." }
          $exe | ForEach-Object { Write-Host "NSIS: $($_.FullName) ($($_.Length) bytes)" }
          $msi | ForEach-Object { Write-Host "MSI: $($_.FullName) ($($_.Length) bytes)" }
      - name: Verify universal macOS executable
        if: matrix.target == 'macos-universal'
        shell: bash
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/JVC.app/Contents/MacOS/jvc"
          ARCHS="$(lipo -archs "$APP")"
          echo "JVC architectures: $ARCHS"
          grep -qw x86_64 <<< "$ARCHS"
          grep -qw arm64 <<< "$ARCHS"
      - name: Verify macOS camera and microphone usage descriptions
        if: matrix.target == 'macos-universal'
        shell: bash
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/JVC.app"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Contents/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Contents/Info.plist" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: jvc-${{ matrix.target }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
          retention-days: 14

  android:
    needs: resolve-dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jvc-dependency-locks
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/android-cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP/android-cmdline-tools"
          curl -fsSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Install SVG icon renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate Android launcher icons from J. logo
        run: bash apps/android/generate-icons.sh
      - name: Apply JVC Android navigation and media permission gate
        run: bash apps/android/apply-native-overlay.sh
      - name: Build Android debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify Android APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build Android release bundle
        run: cd android && ./gradlew bundleRelease
      - name: Verify Android release bundle archive
        run: unzip -t android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: jvc-android-release-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: jvc-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish JVC installers
    runs-on: ubuntu-24.04
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches the checked-in app version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $VERSION." >&2
            exit 1
          fi
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: jvc-windows-x64
          path: release-assets/windows
      - name: Download universal macOS installer
        uses: actions/download-artifact@v4
        with:
          name: jvc-macos-universal
          path: release-assets/macos
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: jvc-android-debug
          path: release-assets/android
      - name: Download unsigned Android release bundle
        uses: actions/download-artifact@v4
        with:
          name: jvc-android-release-unsigned
          path: release-assets/android
      - name: List release installers
        shell: bash
        run: find release-assets -type f -print
      - name: Publish GitHub draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JVC ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Automated JVC build candidate for QA and release preparation.

            This draft contains unsigned Windows and macOS installers, a debug-signed Android APK, and an unsigned Android AAB. Do not publish it as a production release until the desktop packages and Android bundle have been signed, the required runtime/device checks have passed, and the privacy disclosures are complete. Replace the draft assets with the signed production packages before publishing.
          files: |
            release-assets/windows/**/*.exe
            release-assets/windows/**/*.msi
            release-assets/macos/**/*.dmg
            release-assets/android/**/*.apk
            release-assets/android/**/*.aab
